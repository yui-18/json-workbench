[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json-workbench"
version = "0.1.0"
description = "Web JSON formatter"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23,<24",
    "prometheus-client==0.26.0",
]

[tool.setuptools.packages.find]
include = ["json_workbench*"]

[tool.setuptools.package-data]
json_workbench = ["templates/*.html"]
