name: Build and publish

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tool
        run: python -m pip install build

      - name: Build wheel
        run: bash scripts/build.sh

      - name: Save wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Prepare image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            .

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish Docker image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"

          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"

          cat > "$RUNNER_TEMP/deploy-ssh/config" <<EOF
          Host deploy-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port 22
            IdentityFile $RUNNER_TEMP/deploy-ssh/key
            UserKnownHostsFile $RUNNER_TEMP/deploy-ssh/known_hosts
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF

      - name: Prepare deployment configuration
        run: |
          APP_IMAGE="$IMAGE:$GITHUB_SHA" \
            docker compose -f deploy/compose.yaml config \
            > "$RUNNER_TEMP/compose.yaml"

      - name: Copy configuration to VPS
        run: |
          scp -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$RUNNER_TEMP/compose.yaml" \
            deploy-vps:/opt/json-workbench/compose.yaml

      - name: Deploy application
        run: |
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            deploy-vps 'bash -se -- /opt/json-workbench' \
            < scripts/deploy.sh

      - name: Remove SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
