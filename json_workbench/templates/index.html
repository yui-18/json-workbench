<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON Workbench</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            background: #181c24;
            color: #e6edf3;
            font-family: sans-serif;
        }
        .hint { color: #aab5c4; }
        .editors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 24px;
        }
        .heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        label { font-size: 18px; font-weight: bold; }
        textarea {
            display: block;
            width: 100%;
            height: 60vh;
            padding: 14px;
            border: 1px solid #465166;
            border-radius: 8px;
            background: #10141b;
            color: #e6edf3;
            font: 14px/1.5 monospace;
            resize: vertical;
            tab-size: 4;
        }
        textarea:focus { outline: 2px solid #79b8ff; }
        textarea.invalid { border-color: #ff9898; }
        .copy {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border: 1px solid #465166;
            border-radius: 8px;
            background: #242c39;
            color: #c8d4e5;
            cursor: pointer;
        }
        .copy:hover { background: #334156; }
        .copy.copied { color: #91dfad; }
        .copy svg { width: 19px; height: 19px; }
        .copy .check { display: none; }
        .copy.copied .sheets { display: none; }
        .copy.copied .check { display: block; }
        #error {
            padding: 0;
            border: 0;
            background: transparent;
            color: #ff9898;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }
        #error[hidden] { display: none; }
        #status { min-height: 24px; color: #aab5c4; }
        @media (max-width: 700px) {
            .editors { grid-template-columns: 1fr; }
        }
        textarea.loading {
            animation: loading-pulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes loading-pulse {
            from { border-color: #465166; }
            to {
                border-color: #79b8ff;
                box-shadow: 0 0 0 2px #79b8ff33;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            textarea.loading {
                animation: none;
                border-color: #79b8ff;
            }
        }
    </style>
</head>
<body>
    <h1>JSON Workbench — форматирование JSON</h1>
    <p class="hint">
        Вставь JSON слева — получишь форматированный справа.
        Можно редактировать любое поле.
    </p>

    <div class="editors">
        <section>
            <div class="heading">
                <label for="source">Компактный JSON</label>
                <button class="copy" type="button" data-field="source"
                        title="Скопировать" aria-label="Скопировать компактный JSON">
                    <svg class="sheets" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.7">
                        <rect x="8" y="8" width="12" height="12" rx="2"/>
                        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
                    </svg>
                    <svg class="check" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <path d="m5 12 4 4L19 6"/>
                    </svg>
                </button>
            </div>
            <textarea id="source" spellcheck="false"
                      placeholder='{"name":"Тест","items":[1,2,3]}'></textarea>
        </section>

        <section>
            <div class="heading">
                <label for="result">Форматированный JSON</label>
                <button class="copy" type="button" data-field="result"
                        title="Скопировать" aria-label="Скопировать форматированный JSON">
                    <svg class="sheets" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.7">
                        <rect x="8" y="8" width="12" height="12" rx="2"/>
                        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
                    </svg>
                    <svg class="check" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <path d="m5 12 4 4L19 6"/>
                    </svg>
                </button>
            </div>
            <textarea id="result" spellcheck="false"
                      placeholder="Результат появится здесь"></textarea>
        </section>
    </div>

    <p><button id="error" type="button" hidden></button></p>
    <p id="status" role="status" aria-live="polite"></p>

    <script>
        const source = document.getElementById("source");
        const result = document.getElementById("result");
        const error = document.getElementById("error");
        const status = document.getElementById("status");

        let timer;
        let controller;
        let revision = 0;
        let problem = null;

        function clearError() {
            source.classList.remove("loading");
            result.classList.remove("loading");
            source.classList.remove("invalid");
            result.classList.remove("invalid");
            error.hidden = true;
            problem = null;
        }

        async function convert(field, currentRevision) {
            const other = field === source ? result : source;
            controller = new AbortController();

            try {
                const response = await fetch("/api/format", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        text: field.value,
                        mode: field === source ? "pretty" : "compact"
                    }),
                    signal: controller.signal
                });

                const data = await response.json();

                // Не применяем ответ, если пользователь уже изменил текст.
                if (currentRevision !== revision) return;

                if (!response.ok) {
                    field.classList.add("invalid");
                    error.textContent = data.error || "Не удалось обработать JSON";

                    if (Number.isInteger(data.position)) {
                        error.textContent +=
                            ` — строка ${data.line}, символ ${data.column}.`;
                        error.title = "Перейти к ошибке";
                        problem = {field, position: data.position};
                    } else {
                        error.title = "";
                    }

                    error.hidden = false;
                    status.textContent = "Второе поле пока не обновлено.";
                    return;
                }

                other.value = data.output;
                status.textContent = "JSON корректный.";
            } catch (exc) {
                if (exc.name === "AbortError" || currentRevision !== revision) {
                    return;
                }
                status.textContent =
                    "Не удалось связаться с сервером. Попробуй изменить текст ещё раз.";
            } finally {
                if (currentRevision === revision) {
                    other.classList.remove("loading");
                }
            }
        }

        for (const field of [source, result]) {
            field.addEventListener("input", () => {
                clearTimeout(timer);
                controller?.abort();
                revision++;
                clearError();

                if (!field.value.trim()) {
                    const other = field === source ? result : source;
                    other.value = "";
                    status.textContent = "";
                    return;
                }

                const other = field === source ? result : source;
                other.classList.add("loading");
                status.textContent = "Проверяем…";
                const currentRevision = revision;
                timer = setTimeout(() => convert(field, currentRevision), 500);
            });
        }

        error.addEventListener("click", () => {
            if (!problem) return;

            const {field, position} = problem;
            const characters = Array.from(field.value);
            const start = characters.slice(0, position).join("").length;
            const end = start + (characters[position]?.length ?? 0);

            field.focus();
            field.setSelectionRange(start, end);
        });

        for (const button of document.querySelectorAll(".copy")) {
            button.addEventListener("click", async () => {
                const field = document.getElementById(button.dataset.field);

                try {
                    await navigator.clipboard.writeText(field.value);
                    button.classList.add("copied");
                    setTimeout(() => button.classList.remove("copied"), 1500);
                } catch {
                    field.focus();
                    field.select();
                    status.textContent =
                        "Текст выделен — нажми Ctrl+C или Cmd+C.";
                }
            });
        }
    </script>
</body>
</html>
